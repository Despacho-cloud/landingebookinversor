<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1730" />

    <title>Proyecto Starter Kits — Ronda privada de inversión | HAN'EI Academy · MyEB2.life</title>
    <meta
      name="description"
      content="Ronda privada de inversión del Proyecto Starter Kits: arranque $1,200, meta total $3,000, ciclo de 6 meses y retorno objetivo de 9% a 14% según el plan. Sin carga operativa para el inversionista."
    />
    <meta name="robots" content="noindex, nofollow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Proyecto Starter Kits — Ronda privada de inversión" />
    <meta
      property="og:description"
      content="Arranque $1,200 · Meta total $3,000 · Ciclo 6 meses · Retorno objetivo 9%–14%. Documento de apoyo comercial; toda inversión implica riesgo."
    />

    <!-- Las fuentes se auto-alojan desde src/index.css: sin peticiones a
         terceros que bloqueen el primer render. -->

    <!--
      CSS crítico, en línea.

      El navegador tarda ~1 s en bajar y ejecutar el JS antes de que React
      pinte el primer contenido. Sin esto, ese segundo es una pantalla en
      blanco. Con esto pinta el azul de la marca en cuanto llega el HTML, y la
      espera se percibe como que el sitio ya empezó a cargar.
    -->
    <style>
      html {
        background: #0d1730;
      }
      body {
        margin: 0;
        background: #0d1730;
      }
      /* Marca de agua mientras monta React; se retira sola al montarse. */
      #arranque {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.375rem;
        letter-spacing: 0.02em;
        color: #f7f9fc;
        opacity: 0.9;
      }
      #arranque span {
        color: #c9a227;
        font-size: 0.6rem;
        font-family: system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        display: block;
        margin-top: 0.6rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="arranque">
        <div>
          Starter Kits
          <span>Ronda privada</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
